<html>
<head><title>{{ v.brand }} - Sign In</title></head>
<body style="background:#e8e8e0;">
<font face="Verdana, Arial" size="2">
<br><br>
<table align="center" border="0" cellpadding="6" style="background:#fff; border:1px solid #999;">
<form method="post" action="/login">
<input type="hidden" name="next" value="{{ next }}">
<tr><td colspan="2" style="background:#d9dce8;"><b>{{ v.brand }} - SIGN IN</b></td></tr>
{% if reason == 'timeout' %}
<tr><td colspan="2"><font color="#a00">Your session has expired. Please sign in again.</font></td></tr>
{% endif %}
{% if error %}
<tr><td colspan="2"><font color="#a00">{{ error }}</font></td></tr>
{% endif %}
<tr><td>User ID</td><td><input type="text" name="userid" size="20"></td></tr>
<tr><td>Password</td><td><input type="password" name="password" size="20"></td></tr>
<tr><td></td><td><input type="submit" value="Sign In"></td></tr>
</form>
</table>
</font>
</body>
</html>
