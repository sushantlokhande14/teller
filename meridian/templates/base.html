<html>
<head>
<title>Meridian Core Servicing v4.2</title>
<style>
body { background: #e8e8e0; margin: 8px; }
.c1 { background: #ffffff; border: 1px solid #999; }
.c2 { background: {{ v.accent }}; }
.c3 { background: #fff8d0; border: 1px solid #c9b400; }
.c4 { background: #ffe0e0; border: 1px solid #c00; }
.c5 { background: #e0ffe0; border: 1px solid #090; }
</style>
</head>
<body>
<font face="Verdana, Arial" size="2">
<table width="100%" border="0" cellpadding="2" cellspacing="0" class="c2">
<tr><td><b>{{ v.brand }}</b></td>
<td align="right"><font size="1">Release {{ v.version }} &nbsp;|&nbsp; {{ user if user is defined else '' }}</font></td></tr>
</table>
<br>
{% block body %}{% endblock %}
<br>
<table width="100%" border="0"><tr><td align="center"><font size="1" color="#666">
{{ v.org }} (fictional). Unauthorized access is prohibited.
</font></td></tr></table>
</font>
</body>
</html>
