# A tenant overlay. This is everything that differs for one institution running
# the same Meridian product; the capability files stay untouched.
#
#   teller replay capabilities/member_savings_balance.json --tenant tenants/example-credit-union.yaml ...
#
# Only keys present here override the base profile. Conditions are matched by id,
# so a tenant can swap how session expiry looks without re-recording anything.

base_url: http://127.0.0.1:5057        # this tenant's own instance
version: "4.2.117"

conditions:
  # This institution's build shows a branded interstitial after sign-in.
  - id: welcome_banner
    kind: recoverable
    when: {text: "Welcome to Example Credit Union"}
    then:
      kind: dismiss
      target:
        describe: Continue button on the welcome banner
        role: button
        name: Continue
        frame: [main]
        locators:
          - {strategy: role, value: Continue}
